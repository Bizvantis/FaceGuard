[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faceguard"
version = "1.0.0"
description = "Face recognition, liveness detection and presence security (auto-lock / intruder capture) for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
    "PySide6-Essentials>=6.6",
    "scikit-learn>=1.3",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
faceguard = "faceguard.cli:main"

[project.gui-scripts]
faceguard-app = "faceguard.gui.app:main"

[tool.setuptools.packages.find]
include = ["faceguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the downloaded neural-network models", "gui: needs PySide6"]
